# Mọi giá trị dạng ${TEN:mac_dinh} đọc từ biến môi trường TEN, không có thì dùng giá trị mặc định
# (mặc định = chạy trên máy với SQL Server của docker compose). Khi deploy, đặt biến môi trường trên Render.
server.port=${PORT:8080}
# Chạy sau proxy HTTPS của Render: lấy đúng https:// khi tạo link ảnh bìa
server.forward-headers-strategy=framework

# ===== Database =====
# Trên máy: SQL Server (docker compose ở thư mục gốc).
# Khi deploy: đặt DB_URL=jdbc:postgresql://... (Neon), driver tự nhận theo URL.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1434;databaseName=travel_plan;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:TravelPlan@123}
# Host miễn phí giới hạn số kết nối, giữ pool nhỏ
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Hibernate tự tạo/cập nhật bảng theo entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Dùng NVARCHAR để lưu tiếng Việt có dấu (PostgreSQL vốn lưu UTF-8 nên không ảnh hưởng)
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# ===== JWT =====
# Khi deploy BẮT BUỘC đặt JWT_SECRET là chuỗi ngẫu nhiên dài ít nhất 32 ký tự
app.jwt.secret=${JWT_SECRET:doi-chuoi-bi-mat-nay-thanh-chuoi-dai-it-nhat-32-ky-tu}
app.jwt.expiration-ms=86400000

# ===== CORS: địa chỉ frontend được phép gọi API (ngăn cách bằng dấu phẩy, cho phép dấu *) =====
# Khi deploy: CORS_ORIGINS=https://ten-ban.infinityfreeapp.com,http://ten-ban.infinityfreeapp.com
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# ===== Ảnh bìa tải lên =====
# Thư mục lưu ảnh (tương đối với nơi chạy backend)
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
