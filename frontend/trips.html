<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Chuyến đi của tôi - travelplan</title>
</head>
<body data-page="trips">
  <header class="site-header" id="siteHeader"></header>
  <main class="wrap page">
    <div class="page-head">
      <div>
        <p class="eyebrow" id="greeting">Đi đâu tiếp đây?</p>
        <h1 class="h-display page-title">Chuyến đi của bạn</h1>
      </div>
      <a href="trip-form.html" class="btn btn-primary btn-lg">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        Chuyến mới
      </a>
    </div>
    <div class="filters" id="filters" role="group" aria-label="Lọc chuyến đi"></div>
    <div id="tripList" aria-live="polite"><div class="trip-grid">
      <div class="skeleton" style="height:330px"></div><div class="skeleton" style="height:330px"></div><div class="skeleton" style="height:330px"></div>
    </div></div>
  </main>
  <footer class="site-footer">
    <div class="wrap"><span>© 2026 travelplan</span><span>Đi nhiều, tính ít, chơi hết mình.</span></div>
  </footer>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/trips.js"></script>
</body>
</html>
