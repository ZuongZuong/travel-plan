<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Đăng nhập - travelplan</title>
</head>
<body data-page="login">
  <header class="site-header plain" id="siteHeader"></header>
  <main class="auth-page">
    <div class="card auth-card">
      <div>
        <p class="eyebrow">Chào bạn quay lại</p>
        <h1 class="h-display">Đăng nhập</h1>
      </div>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" type="email" id="email" name="email" placeholder="ban@vidu.com" autocomplete="email" maxlength="150">
        </div>
        <div class="field">
          <label for="password">Mật khẩu</label>
          <input class="input" type="password" id="password" name="password" placeholder="••••••" autocomplete="current-password" maxlength="100">
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">Đăng nhập</button>
      </form>
      <p class="auth-switch">Chưa có tài khoản? <a href="register.html" id="switchLink">Đăng ký ngay</a></p>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
